services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      SAMPLE_DOCS_DIR: /app/sample_docs
    volumes:
      - ./data:/app/data
      - ./sample_docs:/app/sample_docs:ro
      - ./evaluation:/app/evaluation:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
